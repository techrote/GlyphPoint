name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Source, documentation and editor regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - run: npm run release:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GlyphPoint-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  browsers:
    name: Browser workflows (${{ matrix.label }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux, three engines
            engines: chromium firefox webkit
            smoke: '0'
          - os: windows-2022
            label: Windows, Chromium smoke
            engines: chromium
            smoke: '1'
          - os: macos-14
            label: macOS, WebKit smoke
            engines: webkit
            smoke: '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npx playwright install --with-deps ${{ matrix.engines }}
      - run: npm run test:browser -- ${{ matrix.engines }}
        env:
          GP_RUN_SMOKE: ${{ matrix.smoke }}
